name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      - run: python -m py_compile databricks/01_medallion_notebook.py
      - run: pytest -q
      - run: python -m src.pipeline --sample
      - run: dbt build --profiles-dir .
      - name: Verify local quality summary
        run: |
          python -c "import json; from pathlib import Path; p=Path('artifacts/run_summary.json'); d=json.loads(p.read_text()); assert d['quality_checks_passed']==10 and d['quality_checks_total']==10; assert d['silver_rows']==12"
