version: 2

models:
  - name: stg_trips
    description: Clean trip-level records produced by the Silver pipeline.
    columns:
      - name: trip_id
        data_tests: [not_null, unique]
      - name: pickup_datetime
        data_tests: [not_null]
      - name: pickup_zone
        data_tests: [not_null]
  - name: fct_daily_zone_trips
    description: One row per pickup date and pickup zone for dashboard serving.
    columns:
      - name: pickup_date
        data_tests: [not_null]
      - name: pickup_zone
        data_tests: [not_null]
      - name: trip_count
        data_tests: [not_null]

